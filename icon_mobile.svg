<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mobile_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow_m" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#mobile_grad)" filter="url(#shadow_m)" />

  <!-- Phone Silhouette -->
  <rect x="18" y="10" width="28" height="44" rx="5" fill="#FFFFFF" opacity="0.95" />
  <rect x="21" y="15" width="22" height="30" rx="2" fill="#0F172A" />
  <rect x="29" y="12" width="6" height="1.5" rx="0.75" fill="#CBD5E1" />
  <circle cx="32" cy="48" r="1.5" fill="#CBD5E1" />

  <!-- Companion Sparkle / Plus Badge -->
  <circle cx="44" cy="42" r="11" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
  <!-- Download Arrow into Phone -->
  <path d="M44 36 L44 46 M40 42 L44 46 L48 42" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
