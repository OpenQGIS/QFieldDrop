<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="drop_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0284C7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#drop_bg)" filter="url(#shadow)" />

  <!-- Phone Silhouette -->
  <rect x="18" y="10" width="28" height="44" rx="5" fill="#FFFFFF" opacity="0.95" />
  <rect x="21" y="15" width="22" height="30" rx="2" fill="#0F172A" />
  
  <!-- Notch and Home indicator -->
  <rect x="29" y="12" width="6" height="1.5" rx="0.75" fill="#CBD5E1" />
  <circle cx="32" cy="48" r="1.5" fill="#CBD5E1" />

  <!-- QR Matrix miniature inside phone -->
  <rect x="23" y="17" width="5" height="5" fill="#38BDF8" />
  <rect x="24" y="18" width="3" height="3" fill="#0F172A" />
  <rect x="36" y="17" width="5" height="5" fill="#38BDF8" />
  <rect x="37" y="18" width="3" height="3" fill="#0F172A" />
  <rect x="23" y="27" width="5" height="5" fill="#38BDF8" />
  <rect x="24" y="28" width="3" height="3" fill="#0F172A" />
  <rect x="31" y="23" width="3" height="3" fill="#34D399" />
  <rect x="36" y="27" width="4" height="4" fill="#34D399" />

  <!-- Wireless / Drop Signal Waves -->
  <path d="M 12 24 C 8 29 8 35 12 40" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <path d="M 52 24 C 56 29 56 35 52 40" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <path d="M 8 20 C 3 27 3 37 8 44" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <path d="M 56 20 C 61 27 61 37 56 44" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.5" />

  <!-- Downward Fast Arrow (Drop badge) -->
  <circle cx="44" cy="44" r="9" fill="#10B981" stroke="#FFFFFF" stroke-width="1.8" />
  <path d="M44 39 L44 47 M40 44 L44 48 L48 44" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
