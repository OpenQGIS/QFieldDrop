<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="send_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0284C7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#send_bg)" filter="url(#shadow)" />

  <!-- Phone Silhouette -->
  <rect x="22" y="10" width="28" height="44" rx="5" fill="#FFFFFF" opacity="0.95" />
  <rect x="25" y="15" width="22" height="30" rx="2" fill="#0F172A" />
  <rect x="33" y="12" width="6" height="1.5" rx="0.75" fill="#CBD5E1" />
  <circle cx="36" cy="48" r="1.5" fill="#CBD5E1" />

  <!-- Outgoing Fast Arrow Badge -->
  <circle cx="20" cy="42" r="12" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />
  <path d="M14 42 L26 42 M21 37 L26 42 L21 47" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Radio/Broadcast Waves -->
  <path d="M 12 20 C 7 26 7 34 12 40" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M 8 16 C 1 24 1 38 8 44" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.4" />
</svg>
