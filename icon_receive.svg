<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="receive_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#receive_bg)" filter="url(#shadow)" />

  <!-- Phone Silhouette -->
  <rect x="14" y="10" width="26" height="42" rx="4.5" fill="#FFFFFF" opacity="0.95" />
  <rect x="17" y="15" width="20" height="28" rx="2" fill="#0F172A" />
  <rect x="24" y="12" width="6" height="1.5" rx="0.75" fill="#CBD5E1" />
  <circle cx="27" cy="47" r="1.5" fill="#CBD5E1" />

  <!-- Incoming / Download Arrow Badge -->
  <circle cx="44" cy="40" r="13" fill="#0284C7" stroke="#FFFFFF" stroke-width="2.5" />
  <path d="M44 32 L44 46 M39 41 L44 46 L49 41" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Inbox tray line -->
  <path d="M37 50 L51 50" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
</svg>
