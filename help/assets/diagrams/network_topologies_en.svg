<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 260" width="1460" height="520" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" style="max-width:730px; display:block; margin: 12px auto; font-family: 'Segoe UI', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#589632" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
  </defs>
  
    <g filter="url(#shadow)">
      <rect x="20" y="20" width="335" height="100" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="20" y="20" width="335" height="30" rx="8" fill="#10B981"/>
      <rect x="20" y="35" width="335" height="15" fill="#10B981"/>
      <text x="35" y="36" font-size="12.5" font-weight="bold" fill="#FFFFFF" dominant-baseline="central">Scene 1: Phone Hotspot (★ Best for Field)</text>
      <text x="35" y="80" font-size="12" fill="#475569">Phone turns on Hotspot ➔ PC connects to phone</text><text x="35" y="100" font-size="12" fill="#475569">Phone acts as gateway, fastest and most reliable</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="375" y="20" width="335" height="100" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="375" y="20" width="335" height="30" rx="8" fill="#0284C7"/>
      <rect x="375" y="35" width="335" height="15" fill="#0284C7"/>
      <text x="390" y="36" font-size="12.5" font-weight="bold" fill="#FFFFFF" dominant-baseline="central">Scene 2: Laptop Hotspot</text>
      <text x="390" y="80" font-size="12" fill="#475569">Laptop turns on mobile hotspot ➔ Phone connects to PC</text><text x="390" y="100" font-size="12" fill="#475569">Good if phone cellular data is restricted</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="20" y="140" width="335" height="100" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="20" y="140" width="335" height="30" rx="8" fill="#6366F1"/>
      <rect x="20" y="155" width="335" height="15" fill="#6366F1"/>
      <text x="35" y="156" font-size="12.5" font-weight="bold" fill="#FFFFFF" dominant-baseline="central">Scene 3: Office / Router Wi-Fi</text>
      <text x="35" y="200" font-size="12" fill="#475569">Both PC and phone connected to same router</text><text x="35" y="220" font-size="12" fill="#475569">Select LAN IP assigned by router (e.g. 192.168.1.x)</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="375" y="140" width="335" height="100" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="375" y="140" width="335" height="30" rx="8" fill="#F59E0B"/>
      <rect x="375" y="155" width="335" height="15" fill="#F59E0B"/>
      <text x="390" y="156" font-size="12.5" font-weight="bold" fill="#FFFFFF" dominant-baseline="central">Scene 4: USB ADB Mode (Zero Wi-Fi)</text>
      <text x="390" y="200" font-size="12" fill="#475569">Zero Wi-Fi or hotspot required, direct USB cable</text><text x="390" y="220" font-size="12" fill="#475569">Bypasses Android sandbox, ideal for high-security sites</text>
    </g>
</svg>