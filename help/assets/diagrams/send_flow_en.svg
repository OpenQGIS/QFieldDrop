<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 175" width="1460" height="350" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" style="max-width:730px; display:block; margin: 12px auto; font-family: 'Segoe UI', sans-serif;">
