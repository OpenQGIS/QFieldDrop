<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="620" height="342" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" style="max-width:100%; height:auto; display:block; margin: 12px auto; font-family: 'Segoe UI', sans-serif;">
  <defs>
    <filter id="win-shadow" x="-3%" y="-2%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <g filter="url(#win-shadow)" transform="translate(20, 10)">
    <rect width="720" height="340" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect width="720" height="34" rx="10" fill="#F1F5F9" />
    <rect y="20" width="720" height="14" fill="#F1F5F9" />
    <circle cx="16" cy="17" r="4.5" fill="#EF4444" />
    <circle cx="30" cy="17" r="4.5" fill="#F59E0B" />
    <circle cx="44" cy="17" r="4.5" fill="#10B981" />
    <text x="65" y="18" font-size="12" font-weight="600" fill="#334155" dominant-baseline="central">QField Mobile Companion Setup</text>

    <!-- Tab Buttons -->
    <g transform="translate(20, 50)">
      <rect width="180" height="30" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="90" y="15" font-size="12" font-weight="bold" fill="#2563EB" text-anchor="middle" dominant-baseline="central">Method 1: QField QR Install</text>
      
      <rect x="190" width="180" height="30" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="280" y="15" font-size="12" fill="#64748B" text-anchor="middle" dominant-baseline="central">Method 2: ADB Push</text>

      <!-- Tab Content Area -->
      <rect y="29" width="680" height="235" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
      
      <!-- Left QR Box -->
      <rect x="25" y="45" width="135" height="135" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <rect x="40" y="60" width="26" height="26" fill="#0F172A"/>
      <rect x="115" y="60" width="26" height="26" fill="#0F172A"/>
      <rect x="40" y="135" width="26" height="26" fill="#0F172A"/>
      <rect x="75" y="95" width="24" height="24" rx="4" fill="#0284C7"/>
      <text x="87" y="108" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle" dominant-baseline="central">Q</text>

      <!-- Right Steps -->
      <g transform="translate(180, 45)">
        <text y="15" font-size="13" font-weight="bold" fill="#0F172A">Install companion inside QField:</text>
        <text y="40" font-size="12" fill="#475569">1. Open QField ➔ Settings ➔ [Plugins] ➔ [Install from URL]</text>
        <text y="65" font-size="12" fill="#475569">2. Tap [📷 Camera Scanner] icon, scan the QR code</text>
        
        <!-- URL Fallback -->
        <text y="105" font-size="12" font-weight="bold" fill="#0F172A">Manual download URL for rugged devices:</text>
        <rect y="115" width="460" height="28" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
        <text x="12" y="129" font-size="11.5" fill="#3B82F6" dominant-baseline="central">http://192.168.43.120:8899/mobile.zip</text>

        <rect y="160" width="220" height="32" rx="4" fill="#6366F1"/>
        <text x="110" y="176" font-size="12" font-weight="bold" fill="#FFF" text-anchor="middle" dominant-baseline="central">⚡ USB / ADB One-Click Push</text>
      </g>
    </g>
  </g>

  <!-- Badges -->
  
    <g transform="translate(115, 145)">
      <circle cx="0" cy="0" r="13" fill="#2563EB" stroke="#FFFFFF" stroke-width="2.5" />
      <text x="0" y="0.5" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
    </g>
  
    <g transform="translate(420, 210)">
      <circle cx="0" cy="0" r="13" fill="#0284C7" stroke="#FFFFFF" stroke-width="2.5" />
      <text x="0" y="0.5" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>
    </g>
  
    <g transform="translate(380, 270)">
      <circle cx="0" cy="0" r="13" fill="#6366F1" stroke="#FFFFFF" stroke-width="2.5" />
      <text x="0" y="0.5" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3</text>
    </g>

  <!-- Explanations -->
  <g transform="translate(40, 370)">
    <rect width="680" height="36" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="20" y="18" font-size="12" font-weight="bold" fill="#2563EB" dominant-baseline="central">① QField [Install from URL] Scan</text>
    <text x="245" y="18" font-size="12" font-weight="bold" fill="#0284C7" dominant-baseline="central">② Or Enter Download URL</text>
    <text x="470" y="18" font-size="12" font-weight="bold" fill="#4F46E5" dominant-baseline="central">③ Or USB 1-Click ADB Push</text>
  </g>

</svg>