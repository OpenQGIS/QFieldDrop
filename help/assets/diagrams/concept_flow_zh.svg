<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 220" width="1480" height="440" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" style="max-width:740px; display:block; margin: 12px auto; font-family: 'Microsoft YaHei', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#589632" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
  </defs>
  
  <!-- Background Badge -->
  <rect x="180" y="8" width="380" height="28" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="370" y="22" font-size="12" font-weight="bold" fill="#1D4ED8" text-anchor="middle" dominant-baseline="central">100% 局域网离线秒直连 · 免云端服务器</text>

  <!-- PC Card -->
  <g transform="translate(30, 50)" filter="url(#shadow)">
    <rect width="180" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="34" rx="10" fill="#1E293B"/>
    <rect x="0" y="20" width="180" height="14" fill="#1E293B"/>
    <circle cx="16" cy="17" r="4" fill="#EF4444"/>
    <circle cx="28" cy="17" r="4" fill="#F59E0B"/>
    <circle cx="40" cy="17" r="4" fill="#10B981"/>
    <text x="100" y="18" font-size="12.5" font-weight="bold" fill="#F8FAFC" text-anchor="middle" dominant-baseline="central">桌面端 QGIS</text>
    
    <!-- Monitor icon representation -->
    <rect x="40" y="50" width="100" height="60" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="75" y="110" width="30" height="15" fill="#94A3B8"/>
    <rect x="60" y="125" width="60" height="4" rx="2" fill="#64748B"/>
    <polygon points="90,65 70,95 110,95" fill="#589632" opacity="0.8"/>
  </g>

  <!-- Outbound Arrow (Top, Drop Out) -->
  <g transform="translate(230, 68)">
    <rect width="280" height="44" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="140" y="15" font-size="12.5" font-weight="bold" fill="#166534" text-anchor="middle" dominant-baseline="central">早晨出工: 投送工程 (Drop Out)</text>
    <text x="140" y="31" font-size="11" fill="#15803D" text-anchor="middle" dominant-baseline="central">自动保存 · 过滤打包 · 扫码 / LocalSend / ADB</text>
    <path d="M -15 22 L 0 22" stroke="#589632" stroke-width="2.5"/>
    <path d="M 280 22 L 295 22" stroke="#589632" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  </g>

  <!-- Inbound Arrow (Bottom, Drop In) -->
  <g transform="translate(230, 138)">
    <rect width="280" height="44" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="140" y="15" font-size="12.5" font-weight="bold" fill="#1E40AF" text-anchor="middle" dominant-baseline="central">傍晚收工: 接收成果 (Drop In)</text>
    <text x="140" y="31" font-size="11" fill="#2563EB" text-anchor="middle" dominant-baseline="central">&lt;0.1s 秒开 · Web扫码回传 · ADB拉取沙盒</text>
    <path d="M 295 22 L 280 22" stroke="#2563EB" stroke-width="2.5"/>
    <path d="M 0 22 L -15 22" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  </g>

  <!-- Phone Card -->
  <g transform="translate(530, 50)" filter="url(#shadow)">
    <rect width="180" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="34" rx="10" fill="#0284C7"/>
    <rect x="0" y="20" width="180" height="14" fill="#0284C7"/>
    <text x="90" y="18" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">移动端 QField</text>
    
    <!-- Phone outline -->
    <rect x="62" y="46" width="56" height="92" rx="8" fill="#0F172A" stroke="#475569" stroke-width="2"/>
    <rect x="66" y="54" width="48" height="74" rx="3" fill="#38BDF8"/>
    <circle cx="90" cy="50" r="1.5" fill="#94A3B8"/>
    <circle cx="90" cy="133" r="3" fill="#64748B"/>
  </g>

</svg>