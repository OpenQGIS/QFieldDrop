<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 185" width="1460" height="370" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" style="max-width:730px; display:block; margin: 12px auto; font-family: 'Microsoft YaHei', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#589632" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
  </defs>
  
    <g filter="url(#shadow)">
      <rect x="20" y="20" width="220" height="145" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="20" y="20" width="220" height="34" rx="10" fill="#10B981"/>
      <rect x="20" y="36" width="220" height="18" fill="#10B981"/>
      <text x="115" y="37" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">方式 A: QField 扫码直装</text>
      <!-- Tag -->
      <rect x="185" y="27" width="45" height="18" rx="9" fill="#FFFFFF" opacity="0.9"/>
      <text x="207" y="36" font-size="10.5" font-weight="bold" fill="#10B981" text-anchor="middle" dominant-baseline="central">推荐</text>
      <text x="130" y="95" font-size="12" fill="#475569" text-anchor="middle">打开 QField -&gt; 设置 -&gt; 插件</text><text x="130" y="117" font-size="12" fill="#475569" text-anchor="middle">从 URL 安装 -&gt; 扫屏幕二维码</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="255" y="20" width="220" height="145" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="255" y="20" width="220" height="34" rx="10" fill="#0284C7"/>
      <rect x="255" y="36" width="220" height="18" fill="#0284C7"/>
      <text x="350" y="37" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">方式 B: 手动输入 URL</text>
      <!-- Tag -->
      <rect x="420" y="27" width="45" height="18" rx="9" fill="#FFFFFF" opacity="0.9"/>
      <text x="442" y="36" font-size="10.5" font-weight="bold" fill="#0284C7" text-anchor="middle" dominant-baseline="central">无相机</text>
      <text x="365" y="95" font-size="12" fill="#475569" text-anchor="middle">输入电脑显示的地址:</text><text x="365" y="117" font-size="12" fill="#475569" text-anchor="middle">http://IP:PORT/mobile.zip</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="490" y="20" width="220" height="145" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="490" y="20" width="220" height="34" rx="10" fill="#6366F1"/>
      <rect x="490" y="36" width="220" height="18" fill="#6366F1"/>
      <text x="585" y="37" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">方式 C: USB/ADB 静默写入</text>
      <!-- Tag -->
      <rect x="655" y="27" width="45" height="18" rx="9" fill="#FFFFFF" opacity="0.9"/>
      <text x="677" y="36" font-size="10.5" font-weight="bold" fill="#6366F1" text-anchor="middle" dominant-baseline="central">极速</text>
      <text x="600" y="95" font-size="12" fill="#475569" text-anchor="middle">手机连接电脑数据线</text><text x="600" y="117" font-size="12" fill="#475569" text-anchor="middle">电脑端点击按钮一键写入</text>
    </g>
</svg>