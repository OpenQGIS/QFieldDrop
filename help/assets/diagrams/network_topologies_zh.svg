<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 260" width="1460" height="520" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" style="max-width:730px; display:block; margin: 12px auto; font-family: 'Microsoft YaHei', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#589632" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
  </defs>
  
    <g filter="url(#shadow)">
      <rect x="20" y="20" width="335" height="100" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="20" y="20" width="335" height="30" rx="8" fill="#10B981"/>
      <rect x="20" y="35" width="335" height="15" fill="#10B981"/>
      <text x="35" y="36" font-size="12.5" font-weight="bold" fill="#FFFFFF" dominant-baseline="central">场景 1: 手机开热点 (★ 外业首选)</text>
      <text x="35" y="80" font-size="12" fill="#475569">手机开启便携热点 ➔ 电脑 Wi-Fi 连接手机</text><text x="35" y="100" font-size="12" fill="#475569">手机即网关，断网也能飞速传输，抗干扰能力最强</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="375" y="20" width="335" height="100" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="375" y="20" width="335" height="30" rx="8" fill="#0284C7"/>
      <rect x="375" y="35" width="335" height="15" fill="#0284C7"/>
      <text x="390" y="36" font-size="12.5" font-weight="bold" fill="#FFFFFF" dominant-baseline="central">场景 2: 电脑开热点</text>
      <text x="390" y="80" font-size="12" fill="#475569">笔记本开启移动热点 ➔ 手机 Wi-Fi 连接电脑</text><text x="390" y="100" font-size="12" fill="#475569">适合笔记本有无线网卡且手机流量受限的场景</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="20" y="140" width="335" height="100" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="20" y="140" width="335" height="30" rx="8" fill="#6366F1"/>
      <rect x="20" y="155" width="335" height="15" fill="#6366F1"/>
      <text x="35" y="156" font-size="12.5" font-weight="bold" fill="#FFFFFF" dominant-baseline="central">场景 3: 驻地/室内局域网</text>
      <text x="35" y="200" font-size="12" fill="#475569">电脑与手机连接同一个 Wi-Fi 路由器</text><text x="35" y="220" font-size="12" fill="#475569">在下拉框选择该路由器分配的局域网 IP (如 192.168.1.x)</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="375" y="140" width="335" height="100" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="375" y="140" width="335" height="30" rx="8" fill="#F59E0B"/>
      <rect x="375" y="155" width="335" height="15" fill="#F59E0B"/>
      <text x="390" y="156" font-size="12.5" font-weight="bold" fill="#FFFFFF" dominant-baseline="central">场景 4: 涉密/纯断网 (USB ADB 模式)</text>
      <text x="390" y="200" font-size="12" fill="#475569">无需任何 Wi-Fi 或热点，USB 数据线直连</text><text x="390" y="220" font-size="12" fill="#475569">穿透 Android 沙盒，适合涉密或无线电管制区域</text>
    </g>
</svg>